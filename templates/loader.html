<!-- LOADER OVERLAY -->
<script src="{{ url_for('static', filename='js/mobile_check.js') }}"></script>
<div id="foundify-loader">
    <div class="loader-content">
        <!-- The Big Blue Radar Spinner -->
        <div class="radar-spinner">
            <div class="radar-core"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring ring-2"></div>
            <div class="radar-sweep"></div>
        </div>
        
        <!-- Organic, Integrated Text -->
        <div class="brand-text">FOUNDIFY</div>
    </div>
</div>

<style>
    /* Loader Overlay */
    #foundify-loader {
        position: fixed;
        inset: 0;
        background: #f9fafb;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    #foundify-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
    }

    /* --- The Big Radar Spinner --- */
    .radar-spinner {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .radar-core {
        width: 16px;
        height: 16px;
        background-color: #4f46e5;
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(79, 70, 229, 0.6);
        z-index: 10;
        animation: pulseCore 2s ease-in-out infinite;
    }

    .radar-ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(79, 70, 229, 0.1);
        border-radius: 50%;
        z-index: 1;
    }

    .radar-ring.ring-2 {
        inset: 16px;
        border: 1px solid rgba(79, 70, 229, 0.15);
    }

    .radar-sweep {
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #4f46e5;
        border-right-color: rgba(79, 70, 229, 0.2);
        z-index: 5;
        animation: sweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.7; }
    }

    @keyframes sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* --- Organic Ethereal Text --- */
    .brand-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #111827; /* Changed to black/dark gray */
        opacity: 0;
        transform: translateY(10px);
        margin-left: 0.3em; /* Compensate for wide tracking to keep it centered */
        
        /* Two animations: one for the reveal, one for continuous breathing */
        animation: 
            cinematicReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
            subtlePulse 2.5s ease-in-out infinite forwards;
        animation-delay: 0.2s, 1.4s;
    }

    @keyframes cinematicReveal {
        0% {
            opacity: 0;
            transform: translateY(10px);
            filter: blur(8px);
            letter-spacing: 0.1em;
        }
        100% {
            opacity: 0.85;
            transform: translateY(0);
            filter: blur(0);
            letter-spacing: 0.3em;
        }
    }

    @keyframes subtlePulse {
        0%, 100% { opacity: 0.85; text-shadow: none; }
        50% { opacity: 1; text-shadow: 0 4px 12px rgba(0,0,0,0.05); }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const loader = document.getElementById('foundify-loader');

        // Minimum time to show the loader to ensure a smooth, professional feel (1.2s)
        const minDisplayTime = 1200;
        const startTime = Date.now();

        window.onload = function () {
            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

            setTimeout(() => {
                loader.classList.add('hidden');
                if (typeof window.checkDevice === 'function') window.checkDevice();
            }, remainingTime);
        };
    });
</script>
