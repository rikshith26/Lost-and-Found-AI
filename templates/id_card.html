<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get QR Code // Foundify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-indigo-500/10 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md mx-auto p-4 z-10">
        <!-- Back Button -->
        <a href="/superadmin/dashboard" class="inline-flex items-center gap-2 text-indigo-600 font-semibold mb-6 hover:text-indigo-800 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span> Back to Dashboard
        </a>

        <!-- QR Code Container -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-8 text-center">
            
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-3xl icon-fill">qr_code_2</span>
            </div>
            
            <h1 class="text-2xl font-black text-gray-900 mb-2">Your Profile QR Code</h1>
            <p class="text-gray-500 text-sm mb-8">Download this QR code and print it on your physical ID card. When scanned, it will open your view-only public profile.</p>

            <!-- Generate QR Code using the backend route -->
            <div class="inline-block p-4 bg-white rounded-2xl shadow-sm border border-gray-100 mb-8">
                <img id="qrImage" src="/api/qrcode?data={{ verify_url | urlencode }}" alt="QR Code" class="w-48 h-48 object-contain">
            </div>

            <div class="flex flex-col gap-3">
                <a href="/api/qrcode?data={{ verify_url | urlencode }}" download="Admin_QR_{{ user.name | replace(' ', '_') }}.png" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold text-sm inline-flex items-center justify-center gap-2 shadow-md transition-all">
                    <span class="material-symbols-outlined">download</span> Download QR Image
                </a>
                
                <a href="{{ verify_url }}" target="_blank" class="w-full bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 px-6 py-3 rounded-xl font-bold text-sm inline-flex items-center justify-center gap-2 transition-all">
                    <span class="material-symbols-outlined">visibility</span> Preview Public Profile
                </a>
            </div>

        </div>
    </div>
</body>
</html>
